[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_drama"]

[project]
name = "audio-drama-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "ebooklib>=0.20",
    "edge-tts>=7.2.8",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pedalboard>=0.9.25",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
audio-drama = "audio_drama.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
